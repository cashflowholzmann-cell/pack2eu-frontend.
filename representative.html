<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pack2EU – Zugang für Bevollmächtigte</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
    :root {
        --primary: #0A2540;
        --primary-light: #1A3A5C;
        --accent: #0066FF;
        --bg: #F7F9FC;
        --border: #E2E8F0;
        --text: #1A202C;
        --text-dim: #64748B;
        --success: #059669;
        --danger: #DC2626;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
    .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-box { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 340px; }
    .auth-box h1 { font-size: 20px; margin: 0 0 6px; color: var(--primary); }
    .auth-box p.hint { font-size: 13px; color: var(--text-dim); margin: 0 0 18px; }
    .auth-box input { width: 100%; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 14px; }
    .auth-box .btn { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .auth-box .btn:disabled { opacity: .6; cursor: default; }
    .auth-box .link-btn { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 0; margin-top: 8px; }
    #auth-error { display: none; background: #FEE2E2; color: var(--danger); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 12px; }
    #auth-success { display: none; background: #D1FAE5; color: #065F46; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 12px; }
    .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Dieser Seite kommt NUR noch die Anmeldung zu (Einladung annehmen,
     Login + Bestätigungscode) - sobald eingeloggt, geht's weiter ins
     Beauftragten-Portal im Haupt-Dashboard (dashboard.html?tab=
     representative), das Übersicht, Material-Grafiken, Kunden-
     Drilldown und echten CSV-Export hat UND in allen 5 Sprachen
     übersetzt ist. Diese Seite hatte früher eine eigene, parallele
     Mini-Variante des Portals direkt hier (siehe Git-Historie) - kam
     aus einer Zeit vor dem Beauftragten-Tab im Dashboard, wurde aber
     nie mitgepflegt, während das Dashboard-Portal weiterentwickelt
     wurde. Jeder Bevollmächtigte landet über seinen Einladungs-Link
     (routes/admin.js, acceptUrl) auf genau dieser Seite - die alte,
     unfertige Variante hier war für echte Bevollmächtigte also nicht
     nur eine überflüssige zweite Baustelle, sondern tatsächlich das,
     was sie zu sehen bekamen. -->
<div id="auth-screen" class="center-screen">
    <div class="auth-box">
        <h1>🔒 Pack2EU – Bevollmächtigte</h1>

        <div id="auth-error"></div>
        <div id="auth-success"></div>

        <!-- Schritt: Einladung annehmen (nur mit ?inviteToken=... in der URL) -->
        <div id="accept-invite-form" class="hidden">
            <p class="hint">Lege dein Passwort fest, um deinen Zugang zu aktivieren.</p>
            <input id="invite-password" type="password" placeholder="Neues Passwort (mind. 8 Zeichen)" onkeydown="if(event.key==='Enter') acceptInvite()">
            <button class="btn" onclick="acceptInvite()">Zugang aktivieren →</button>
        </div>

        <!-- Schritt 1: E-Mail + Passwort -->
        <div id="login-form">
            <p class="hint">Melde dich mit deinen Zugangsdaten an.</p>
            <input id="login-email" type="email" placeholder="E-Mail" onkeydown="if(event.key==='Enter') repLogin()">
            <input id="login-password" type="password" placeholder="Passwort" onkeydown="if(event.key==='Enter') repLogin()">
            <button class="btn" id="login-btn" onclick="repLogin()">Einloggen →</button>
        </div>

        <!-- Schritt 2: Bestätigungscode -->
        <div id="code-form" class="hidden">
            <p class="hint">Wir haben dir einen 6-stelligen Code per E-Mail geschickt.</p>
            <input id="login-code" type="text" inputmode="numeric" maxlength="6" placeholder="123456" onkeydown="if(event.key==='Enter') verifyCode()">
            <button class="btn" onclick="verifyCode()">Bestätigen →</button>
            <button class="link-btn" onclick="backToLogin()">← zurück</button>
        </div>
    </div>
</div>

<script>
const API_BASE = window.PACK2EU_API_BASE || 'https://ack2eu-backend.onrender.com/api';

// Eigener, alter Token-Schlüssel dieser Seite - nur noch gelesen, um
// bereits eingeloggte Bevollmächtigte beim ersten Besuch nach diesem
// Umbau nahtlos durchzureichen (siehe init()), nie mehr neu geschrieben.
function getLegacyRepToken() { return localStorage.getItem('pack2eu_rep_token'); }
function clearLegacyRepToken() { localStorage.removeItem('pack2eu_rep_token'); }

// Ab hier derselbe Token-Schlüssel wie im Haupt-Dashboard
// (dashboard.html liest/schreibt 'pack2eu_token' für Kunden UND
// Bevollmächtigte gleichermaßen).
function setToken(t) { localStorage.setItem('pack2eu_token', t); }

let pendingLoginEmail = null;

function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('auth-success').style.display = 'none';
}
function showSuccess(msg) {
    const el = document.getElementById('auth-success');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('auth-error').style.display = 'none';
}
function clearMessages() {
    document.getElementById('auth-error').style.display = 'none';
    document.getElementById('auth-success').style.display = 'none';
}

function goToDashboard() {
    window.location.href = '/dashboard.html?tab=representative';
}

async function acceptInvite() {
    clearMessages();
    const params = new URLSearchParams(window.location.search);
    const token = params.get('inviteToken');
    const password = document.getElementById('invite-password').value;

    if (!password || password.length < 8) {
        return showError('Bitte ein Passwort mit mindestens 8 Zeichen eingeben.');
    }

    try {
        const res = await fetch(`${API_BASE}/representatives/accept-invite`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (!res.ok) return showError(data.error || 'Einladung konnte nicht angenommen werden.');

        showSuccess('Account aktiviert! Du kannst dich jetzt einloggen.');
        document.getElementById('accept-invite-form').classList.add('hidden');
        document.getElementById('login-form').classList.remove('hidden');
        window.history.replaceState({}, '', window.location.pathname);
    } catch (err) {
        showError('Verbindung fehlgeschlagen. Bitte später erneut versuchen.');
    }
}

async function repLogin() {
    clearMessages();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return showError('Bitte E-Mail und Passwort eingeben.');

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    try {
        const res = await fetch(`${API_BASE}/representatives/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) return showError(data.error || 'Login fehlgeschlagen.');

        pendingLoginEmail = email;
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('code-form').classList.remove('hidden');
        showSuccess(data.message || 'Bestätigungscode wurde verschickt.');
    } catch (err) {
        showError('Verbindung fehlgeschlagen. Bitte später erneut versuchen.');
    } finally {
        btn.disabled = false;
    }
}

async function verifyCode() {
    clearMessages();
    const code = document.getElementById('login-code').value.trim();
    if (!pendingLoginEmail || !code) return showError('Bitte den Code eingeben.');

    try {
        const res = await fetch(`${API_BASE}/representatives/verify-login-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: pendingLoginEmail, code })
        });
        const data = await res.json();
        if (!res.ok) return showError(data.error || 'Code ungültig oder abgelaufen.');

        setToken(data.token);
        goToDashboard();
    } catch (err) {
        showError('Verbindung fehlgeschlagen. Bitte später erneut versuchen.');
    }
}

function backToLogin() {
    clearMessages();
    pendingLoginEmail = null;
    document.getElementById('code-form').classList.add('hidden');
    document.getElementById('login-form').classList.remove('hidden');
}

function init() {
    const params = new URLSearchParams(window.location.search);
    const inviteToken = params.get('inviteToken');

    if (inviteToken) {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('accept-invite-form').classList.remove('hidden');
        return;
    }

    // Noch ein Token unter dem alten Schlüssel dieser Seite vorhanden
    // (von vor diesem Umbau)? Einmalig gegen /me prüfen und bei Erfolg
    // nahtlos ins Dashboard durchreichen, statt den Bevollmächtigten
    // erneut einzuloggen.
    const legacyToken = getLegacyRepToken();
    if (legacyToken) {
        fetch(`${API_BASE}/representatives/me`, { headers: { Authorization: 'Bearer ' + legacyToken } })
            .then(res => res.ok ? res.json() : null)
            .then(me => {
                clearLegacyRepToken();
                if (me) {
                    setToken(legacyToken);
                    goToDashboard();
                }
            })
            .catch(() => clearLegacyRepToken());
    }
}

init();
</script>

</body>
</html>
