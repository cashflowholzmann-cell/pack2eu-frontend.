        :root {
            --primary: #0A2540;
            --primary-light: #1A3A5C;
            --accent: #0A2540;
            --accent-light: #E8F0FE;
            --success: #00B383;
            --warning: #F5A623;
            --danger: #E53E3E;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-dim: #64748B;
            --border: #E2E8F0;
            --shadow: 0 4px 24px rgba(10,37,64,0.08);
            --radius: 16px;
            --font: 'Inter', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all .15s ease;
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(10,37,64,0.25);
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 10px;

            cursor: pointer;
            transition: all .15s ease;
            font-family: var(--font);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--bg);
            transform: translateY(-1px);

        }
